<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Bouche Cousue</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>

<header class="bar">
  <span class="brand" data-i18n="app.title">Bouche Cousue</span>
  <button type="button" class="icon-button" id="closeButton"
          data-i18n-title="ext.close" data-i18n-aria-label="ext.close">✕</button>
</header>

<!-- The switch comes first: it is the only control that matters before the
     camera is on, and the only one an adult reaches for in a hurry. -->
<button type="button" class="button-primary" id="powerButton"
        data-i18n-aria-label="ext.startLabel">🎬 Activer</button>

<p class="boot-error" id="bootError" hidden></p>

<!-- Idle: one line saying what the switch is for. -->
<p class="tagline" id="tagline" data-i18n="ext.idleHint"></p>

<!-- Active: the picture, the reading, and the tuning. -->
<div id="live" hidden>
  <div class="preview">
    <img id="previewImage" alt="" data-i18n-aria-label="ext.cameraLabel">
    <div class="gauge"><div class="gauge__fill" id="gauge"></div></div>
  </div>

  <p class="status">
    <span class="led" id="mouthLed"></span>
    <span id="mouthStatus"></span>
    <button type="button" class="icon-button" id="playButton"
            data-i18n-aria-label="ext.playbackLabel">⏸</button>
  </p>

  <!-- Which player answered the last command. With the target on Automatique
       this is the only way to see what the app decided to drive. -->
  <p class="hint" id="channelLine" hidden></p>

  <section class="settings">
    <label class="setting">
      <span data-i18n="settings.sensitivity">Sensibilité</span>
      <input type="range" id="sensitivity"
             data-i18n-aria-label="settings.sensitivityLabel">
    </label>

    <label class="setting">
      <span data-i18n="settings.warning">Avertissement</span>
      <input type="range" id="warningDelay"
             data-i18n-aria-label="settings.warningLabel">
      <span class="setting__value" id="warningDelayValue"></span>
    </label>

    <label class="setting">
      <span data-i18n="settings.pause">Pause</span>
      <input type="range" id="pauseDelay"
             data-i18n-aria-label="settings.pauseLabel">
      <span class="setting__value" id="pauseDelayValue"></span>
    </label>
  </section>
</div>

<!-- Which player, and whether the child gets a message: both are worth setting
     before the camera is ever switched on. -->
<section class="settings settings--options">
  <!-- No visible label: the choices name themselves, and the panel is short
       enough that a heading over one control is just noise. -->
  <label class="setting setting--select">
    <select id="target" data-i18n-aria-label="settings.targetLabel"></select>
  </label>

  <label class="setting setting--check">
    <input type="checkbox" id="overlay">
    <span data-i18n="settings.overlay">Message à l'écran</span>
  </label>
</section>

<p class="notice" id="accessibilityNotice" hidden>
  <span data-i18n="ext.accessibility"></span>
  <button type="button" class="button-link" id="accessibilityButton"
          data-i18n="ext.accessibilityOpen"></button>
</p>

<p class="notice" id="playerNotice" hidden></p>

<p class="hint" id="hint" data-i18n="ext.hint"></p>

<!-- The way out of an app with no dock icon. It is also in the menu the
     icon's right click opens, for when the panel is not the thing in hand. -->
<footer class="footer">
  <button type="button" class="button-link" id="quitButton" data-i18n="tray.quit"></button>
</footer>

<script type="module" src="panel.js"></script>
</body>
</html>
