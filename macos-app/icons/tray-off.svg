<!-- The menu bar icon, idle: the same face as tray.svg, drawn as an outline
     instead of a solid, so the two read as one icon in two states rather than
     as two icons. Keep the geometry in step. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <circle cx="8" cy="8" r="5.9" fill="none" stroke="#000" stroke-width="1.4"/>
  <circle cx="5.9" cy="6.6" r="0.85" fill="#000"/>
  <circle cx="10.1" cy="6.6" r="0.85" fill="#000"/>
  <rect x="5" y="9.6" width="6" height="1.2" rx="0.6" fill="#000"/>
</svg>
