<!-- The menu bar icon, watching. A template image: macOS ignores every colour
     and keeps only the shape, tinting it for a light or dark menu bar, so this
     drawing is black on nothing and the eyes and mouth are holes. Its twin,
     tray-off.svg, is the same face hollowed out. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <mask id="face">
    <rect width="16" height="16" fill="#fff"/>
    <circle cx="5.7" cy="6.5" r="1" fill="#000"/>
    <circle cx="10.3" cy="6.5" r="1" fill="#000"/>
    <rect x="4.7" y="9.5" width="6.6" height="1.4" rx="0.7" fill="#000"/>
  </mask>
  <circle cx="8" cy="8" r="6.6" fill="#000" mask="url(#face)"/>
</svg>
