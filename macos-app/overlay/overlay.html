<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Bouche Cousue</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>

<!-- The card the child reads, floating over whatever is playing. It decides
     nothing and holds no copy: every sentence arrives already translated, the
     way the extensions' content script is fed. Clicks pass straight through
     it — this is a sign, not a control. -->
<div class="card" id="card">
  <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="22" fill="#ffd23f"/>
    <circle cx="23" cy="27" r="3.2" fill="#2a1a00"/>
    <circle cx="41" cy="27" r="3.2" fill="#2a1a00"/>
    <path id="mascotMouth" d="M22 40 h20" stroke="#2a1a00"
          stroke-width="3.6" stroke-linecap="round" fill="none"/>
  </svg>

  <div class="words">
    <p class="card__title" id="title"></p>
    <p class="card__text" id="text"></p>
  </div>
</div>

<script type="module" src="overlay.js"></script>
</body>
</html>
